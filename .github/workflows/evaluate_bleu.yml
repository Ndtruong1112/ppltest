name: BLEU Score Evaluation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch transformers datasets evaluate sacrebleu tqdm sentencepiece
    
    - name: Run BLEU Score Evaluation
      env:
        PYTHONIOENCODING: utf-8
      run: |
        echo "======================================"
        echo "🎯 BLEU Score Evaluation"
        echo "======================================"
        python final1.py
    
    - name: Upload evaluation results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: evaluation-results-py${{ matrix.python-version }}
        path: |
          *.txt
          *.log
        retention-days: 30

  build-model:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch transformers datasets accelerate
    
    - name: Check training script
      run: |
        python -m py_compile train2.py
        echo "✅ train2.py syntax is valid"
    
    - name: Check test script
      run: |
        python -m py_compile testdich.py
        echo "✅ testdich.py syntax is valid"
    
    - name: Check evaluation script
      run: |
        python -m py_compile final1.py
        echo "✅ final1.py syntax is valid"

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
    
    - name: Check code formatting with black
      run: |
        black --check *.py || true
    
    - name: Check import sorting with isort
      run: |
        isort --check-only *.py || true
    
    - name: Lint with flake8
      run: |
        flake8 *.py --count --select=E9,F63,F7,F82 --show-source --statistics || true
